<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}Geomix{% endblock %}</title>
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='logo.png') }}"/>
  <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='logo.png') }}"/>
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='logo.png') }}"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"/>
</head>

<body>
  {% block body %}{% endblock %}

  <!-- Janela de confirmação reutilizável (P-13) -->
  <div class="modal-overlay" id="confirm-modal" style="display:none" role="alertdialog" aria-modal="true"
       aria-labelledby="confirm-title" aria-describedby="confirm-text">
    <div class="modal-box">
      <h2 id="confirm-title"></h2>
      <p id="confirm-text" class="confirm-text"></p>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" id="confirm-cancel">Ficar aqui</button>
        <button type="button" class="btn btn-primary btn-3d" id="confirm-ok">Sair</button>
      </div>
    </div>
  </div>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
